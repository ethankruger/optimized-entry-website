<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimized Entry - AI Reception & Booking</title>
  <meta name="description"
    content="AI reception and booking that turns calls into customers — automatically. Never miss a business opportunity with Optimized Entry.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://optimizedentry.com">
  <meta property="og:title" content="Optimized Entry - AI Reception & Booking">
  <meta property="og:description" content="AI reception and booking that turns calls into customers — automatically. Never miss a business opportunity with Optimized Entry.">
  <meta property="og:image" content="https://optimizedentry.com/img/logo-mark.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://optimizedentry.com">
  <meta property="twitter:title" content="Optimized Entry - AI Reception & Booking">
  <meta property="twitter:description" content="AI reception and booking that turns calls into customers — automatically. Never miss a business opportunity with Optimized Entry.">
  <meta property="twitter:image" content="https://optimizedentry.com/img/logo-mark.png">

  <link rel="icon" type="image/png" sizes="16x16" href="/img/logo-mark.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo-mark.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo-mark.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">

  <!-- Structured Data for Google Search -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Optimized Entry",
      "alternateName": "OptimizedEntry",
      "url": "https://optimizedentry.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://optimizedentry.com/img/logo-mark.png",
        "width": 281,
        "height": 222
      },
      "description": "AI reception and booking that turns calls into customers — automatically.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@optimizedentry.com"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- Hidden forms for Netlify form detection -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <textarea name="message"></textarea>
  </form>

  <form name="demo-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="demo-request" />
    <input name="bot-field" />
    <input name="firstName" />
    <input name="lastName" />
    <input name="email" />
    <input name="company" />
    <input name="phone" />
  </form>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
